<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded App Icon Badge -->
  <rect width="64" height="64" rx="16" fill="#0b1120"/>
  
  <!-- Sun & Rays -->
  <!-- Center Top Ray -->
  <line x1="32" y1="9" x2="32" y2="15" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Ray 1 -->
  <line x1="23" y1="12" x2="26" y2="17" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Ray 1 -->
  <line x1="41" y1="12" x2="38" y2="17" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Ray 2 -->
  <line x1="16" y1="19" x2="21" y2="21" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Ray 2 -->
  <line x1="48" y1="19" x2="43" y2="21" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Rising Sun -->
  <circle cx="32" cy="25" r="9" fill="#f59e0b"/>

  <!-- Mountain Backdrop Left -->
  <polygon points="12,42 24,24 36,42" fill="#059669"/>
  <!-- Left Mountain Snowcap -->
  <polygon points="24,24 21,29 24,31 27,29" fill="#ffffff" opacity="0.9"/>

  <!-- Mountain Backdrop Right -->
  <polygon points="28,42 42,26 52,42" fill="#10b981"/>
  <!-- Right Mountain Snowcap -->
  <polygon points="42,26 39,31 43,32 45,30" fill="#ffffff" opacity="0.9"/>

  <!-- Indigo Ground / Water Arc -->
  <path d="M16 43 Q32 54 48 43" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>

  <!-- Campfire Flames -->
  <!-- Outer Flame -->
  <path d="M32 29 C34 33, 40 37, 39 43 C38 48, 33 49, 32 49 C31 49, 26 48, 25 43 C24 37, 30 33, 32 29 Z" fill="#ea580c"/>
  <!-- Inner Flame -->
  <path d="M32 36 C33 39, 36 41, 35 45 C34 47, 33 48, 32 48 C31 48, 30 47, 29 45 C28 41, 31 39, 32 36 Z" fill="#fbbf24"/>
</svg>
